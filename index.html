<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Nhúng CSS vào trang HTML</title>
    <!-- Liên kết tệp CSS riêng biệt qua thẻ link -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Nội dung chính theo yêu cầu đề bài -->
    <h1>This is heading 1</h1>
    <p>This is an ordinary paragraph. Notice that this text is blue. The default text color for a page is defined in the body selector.</p>

    <!-- Áp dụng inline-style trực tiếp trên thẻ -->
    <h1 style="color: red;">Tiêu đề áp dụng inline-style</h1>
    <p style="color: red;">Đoạn văn áp dụng inline-style để đổi màu chữ.</p>

    <!-- Áp dụng các định dạng từ file style.css -->
    <p class="external-text">Đoạn văn này sử dụng style từ tệp style.css.</p>

</body>
</html>
